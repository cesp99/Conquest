[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aho-corasick.workspace = true
anyhow.workspace = true
clock.workspace = true
fs.workspace = true
futures.workspace = true
fuzzy.workspace = true
gpui.workspace = true
# Line diffing for the git gutter, and the same one Zed diffs with — see
# `language::text_diff`, which this mirrors so a hunk lands where Zed puts it.
imara-diff.workspace = true
grammars = { workspace = true, features = ["load-grammars"] }
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
path.workspace = true
regex.workspace = true
rope.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
settings_json.workspace = true
streaming-iterator.workspace = true
sum_tree.workspace = true
text.workspace = true
# The Conquest trash implementation; `[patch]` in the workspace manifest points
# `fs`'s `trash` dependency at this same crate.
trash = { path = "../trash-android" }
tree-sitter.workspace = true
# For `paths::PathMatcher`, so include/exclude globs behave exactly as they do
# in Zed. Already in the tree as a dependency of `worktree`.
util.workspace = true
worktree.workspace = true

[dev-dependencies]
tempfile.workspace = true
