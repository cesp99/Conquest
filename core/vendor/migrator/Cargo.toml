[package]
name = "migrator"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

# CONQUEST PATCH: inline tests are off — they need the dev-dependencies
# stripped when vendoring (see VENDOR.md). Tier-0 crates keep theirs.
[lib]
test = false
path = "src/migrator.rs"
doctest = false

[dependencies]
anyhow.workspace = true
collections.workspace = true
convert_case.workspace = true
log.workspace = true
streaming-iterator.workspace = true
tree-sitter-json.workspace = true
tree-sitter = { workspace = true, features = ["wasm"] }
serde_json_lenient.workspace = true
serde_json.workspace = true
settings_content.workspace = true
settings_json.workspace = true
