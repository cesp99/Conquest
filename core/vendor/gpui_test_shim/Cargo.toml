[package]
name = "gpui"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = """
Conquest-written stand-in for Zed's gpui crate, providing only the
#[gpui::test] attribute macro so vendored crates keep their randomized
tests without pulling in the real gpui. Not vendored from Zed.
"""

[lib]
proc-macro = true

[features]
# Accepted for compatibility with vendored dev-dependency declarations.
test-support = []

[dependencies]
quote.workspace = true
syn.workspace = true
