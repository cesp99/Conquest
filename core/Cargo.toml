[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/jni-bridge",
    "vendor/clock",
    "vendor/collections",
    "vendor/gpui_shared_string",
    "vendor/gpui_test_shim",
    "vendor/gpui_util",
    "vendor/grammars",
    "vendor/language_core",
    "vendor/path",
    "vendor/perf",
    "vendor/rope",
    "vendor/sum_tree",
    "vendor/text",
    "vendor/util",
    "vendor/util_macros",
    "vendor/zlog",
    "vendor/ztracing",
    "vendor/ztracing_macro",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/cesp99/ConquestCodebyEyed"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.dependencies]
# Our crates
engine = { path = "crates/engine" }

# Vendored Zed crates (upstream commit pinned in vendor/VENDOR.md)
clock = { path = "vendor/clock" }
collections = { path = "vendor/collections" }
gpui = { path = "vendor/gpui_test_shim" } # test-macro shim, NOT Zed's gpui
gpui_shared_string = { path = "vendor/gpui_shared_string" }
gpui_util = { path = "vendor/gpui_util" }
grammars = { path = "vendor/grammars" }
language_core = { path = "vendor/language_core" }
path = { path = "vendor/path" }
perf = { path = "vendor/perf" }
rope = { path = "vendor/rope" }
sum_tree = { path = "vendor/sum_tree" }
text = { path = "vendor/text" }
util = { path = "vendor/util" }
util_macros = { path = "vendor/util_macros" }
zlog = { path = "vendor/zlog" }
ztracing = { path = "vendor/ztracing" }
ztracing_macro = { path = "vendor/ztracing_macro" }

# External dependencies. Versions/features mirror Zed's workspace pins at the
# vendored commit — keep them in sync when syncing vendor/.
anyhow = "1.0.86"
async-fs = "2.1"
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
chrono = { version = "0.4", features = ["serde"] }
ctor = "1.0.12"
dirs = "6.0"
dunce = "1.0"
futures = "0.3.32"
futures-lite = "1.13"
globset = "0.4"
heapless = "0.9.2"
indexmap = { version = "2.7.0", features = ["serde"] }
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
nix = "0.29"
parking_lot = "0.12.1"
percent-encoding = "2.3.2"
postage = { version = "0.5", features = ["futures-traits"] }
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
quote = "1.0.9"
rand = "0.9"
rayon = "1.8"
regex = "1.5"
rust-embed = { version = "8.11", features = ["include-exclude"] }
rustc-hash = "2.1.0"
schemars = { version = "1.0", features = ["indexmap2"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
serde_json_lenient = { version = "0.2", features = ["preserve_order", "raw_value"] }
shlex = "1.3.0"
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = "2.0"
streaming-iterator = "0.1"
syn = { version = "2.0.101", features = ["full", "extra-traits", "visit-mut"] }
take-until = "0.2.0"
tempfile = "3.20.0"
toml = "0.8"
tracing = "0.1.40"
tree-sitter = "0.26.9"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "5cb9b693cfd7bfacab1d9ff4acac1a4150700609" }
tree-sitter-css = "0.23"
tree-sitter-diff = "0.1.0"
tree-sitter-gitcommit = { git = "https://github.com/zed-industries/tree-sitter-git-commit", rev = "88309716a69dd13ab83443721ba6e0b491d37ee9" }
tree-sitter-go = "0.25"
tree-sitter-go-mod = { git = "https://github.com/camdencheek/tree-sitter-go-mod", rev = "2e886870578eeba1927a2dc4bd2e2b3f598c5f9a", package = "tree-sitter-gomod" }
tree-sitter-gowork = { git = "https://github.com/zed-industries/tree-sitter-go-work", rev = "acb0617bf7f4fda02c6217676cc64acb89536dc7" }
tree-sitter-jsdoc = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = { git = "https://github.com/zed-industries/tree-sitter-markdown", rev = "b596e737286780d7bfa9fcddceaeeb754574b352" }
tree-sitter-python = "0.25"
tree-sitter-regex = "0.24"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = { git = "https://github.com/zed-industries/tree-sitter-typescript", rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899" }
tree-sitter-yaml = { git = "https://github.com/zed-industries/tree-sitter-yaml", rev = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a" }
unicase = "2.6"
unicode-segmentation = "1.10"
url = "2.2"
walkdir = "2.5"
which = "6.0.0"

# App-side (non-Zed) dependencies
jni = "0.21"
android_logger = "0.14"

[profile.release]
lto = "thin"
opt-level = 3
strip = "symbols"

[profile.dev]
# Keep dev builds fast but usable on device.
opt-level = 1
